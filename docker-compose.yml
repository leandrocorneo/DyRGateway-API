services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: DyRGateway
    ports:
      - "9000:9000"
    environment:
      - PORT=9000
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/dyr_gateway?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./:/app
      - /app/node_modules
    command: sh -c "npx prisma generate && npm run dev"
    depends_on:
      - postgres
      - redis
    restart: always

  postgres:
    image: postgres:15-alpine
    container_name: DyRGateway-Postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dyr_gateway
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: DyRGateway-Redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
  redis_data: