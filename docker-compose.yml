services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: DyRGateway
    ports:
      - "${GATEWAY_HOST_PORT}:${PORT}"
    environment:
      PORT: ${PORT}
      NODE_ENV: ${NODE_ENV}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      METRICS_INTERVAL_SECONDS: ${METRICS_INTERVAL_SECONDS}
      METRICS_RETENTION_DAYS: ${METRICS_RETENTION_DAYS}
      METRICS_SPOOL_PATH: ${METRICS_SPOOL_PATH}
      PROXY_TIMEOUT_MS: ${PROXY_TIMEOUT_MS}
      SLOW_DATABASE_MS: ${SLOW_DATABASE_MS}
      SLOW_REDIS_MS: ${SLOW_REDIS_MS}
      SLOW_UPSTREAM_MS: ${SLOW_UPSTREAM_MS}
      DOCKER_PROXY_URL: ${DOCKER_PROXY_URL}
      DOCKER_CONTROL_PROXY_URL: ${DOCKER_CONTROL_PROXY_URL}
      DOCKER_ACTION_TIMEOUT_MS: ${DOCKER_ACTION_TIMEOUT_MS}
      DOCKER_STOP_TIMEOUT_SECONDS: ${DOCKER_STOP_TIMEOUT_SECONDS}
      DOCKER_PROTECTED_PROJECTS: ${DOCKER_PROTECTED_PROJECTS}
      DOCKER_PROTECTED_CONTAINERS: ${DOCKER_PROTECTED_CONTAINERS}
    mem_limit: ${GATEWAY_MEMORY_LIMIT}
    labels:
      com.dyrgateway.component: api
    volumes:
      - ./:/app
      - /app/node_modules
      - metrics_spool:/var/lib/dyr-metrics
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker-proxy:
        condition: service_started
      docker-control-proxy:
        condition: service_started
    networks:
      - default
      - docker-monitoring
      - docker-control
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:${PORT}/api/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: always

  metrics-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: DyRGateway-Metrics
    environment:
      NODE_ENV: ${NODE_ENV}
      METRICS_PROCESS_ROLE: ${METRICS_PROCESS_ROLE}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      DOCKER_PROXY_URL: ${DOCKER_PROXY_URL}
      DOCKER_METRICS_CONCURRENCY: ${DOCKER_METRICS_CONCURRENCY}
      DOCKER_METRICS_TIMEOUT_MS: ${DOCKER_METRICS_TIMEOUT_MS}
      API_PROBE_URL: ${API_PROBE_URL}
      METRICS_INTERVAL_SECONDS: ${METRICS_INTERVAL_SECONDS}
      METRICS_RETENTION_DAYS: ${METRICS_RETENTION_DAYS}
      METRICS_SPOOL_PATH: ${METRICS_SPOOL_PATH}
      SLOW_DATABASE_MS: ${SLOW_DATABASE_MS}
    mem_limit: ${METRICS_WORKER_MEMORY_LIMIT}
    volumes:
      - ./:/app
      - /app/node_modules
      - metrics_spool:/var/lib/dyr-metrics
    command: sh -c "npx prisma generate && npm run metrics:worker"
    depends_on:
      gateway:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    networks:
      - default
      - docker-monitoring
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'tsx.*monitoring/worker' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always

  docker-proxy:
    image: ${DOCKER_PROXY_IMAGE}
    container_name: DyRGateway-DockerProxy
    environment:
      CONTAINERS: ${DOCKER_PROXY_CONTAINERS}
      INFO: ${DOCKER_PROXY_INFO}
      SYSTEM: ${DOCKER_PROXY_SYSTEM}
      VOLUMES: ${DOCKER_PROXY_VOLUMES}
      POST: ${DOCKER_PROXY_POST}
      EXEC: ${DOCKER_PROXY_EXEC}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-monitoring
    restart: always

  docker-control-proxy:
    image: ${DOCKER_PROXY_IMAGE}
    container_name: DyRGateway-DockerControlProxy
    environment:
      CONTAINERS: ${DOCKER_CONTROL_PROXY_CONTAINERS}
      POST: ${DOCKER_CONTROL_PROXY_POST}
      ALLOW_START: ${DOCKER_CONTROL_PROXY_ALLOW_START}
      ALLOW_STOP: ${DOCKER_CONTROL_PROXY_ALLOW_STOP}
      ALLOW_RESTARTS: ${DOCKER_CONTROL_PROXY_ALLOW_RESTARTS}
      ALLOW_PAUSE: ${DOCKER_CONTROL_PROXY_ALLOW_PAUSE}
      ALLOW_UNPAUSE: ${DOCKER_CONTROL_PROXY_ALLOW_UNPAUSE}
      EXEC: ${DOCKER_CONTROL_PROXY_EXEC}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-control
    restart: always

  postgres:
    image: postgres:15-alpine
    container_name: DyRGateway-Postgres
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
      - -c
      - compute_query_id=on
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    mem_limit: ${POSTGRES_MEMORY_LIMIT}
    labels:
      com.dyrgateway.component: database
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: DyRGateway-Redis
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY}
      - --maxmemory-policy
      - ${REDIS_MAXMEMORY_POLICY}
      - --latency-tracking
      - ${REDIS_LATENCY_TRACKING}
      - --latency-tracking-info-percentiles
      - ${REDIS_LATENCY_PERCENTILES}
    mem_limit: ${REDIS_MEMORY_LIMIT}
    labels:
      com.dyrgateway.component: redis
    ports:
      - "${REDIS_HOST_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  postgres_data:
  redis_data:
  metrics_spool:

networks:
  docker-monitoring:
    internal: true
  docker-control:
    internal: true
